name: Android CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    # app pins NDK 30; lib on the beta.2 stack pins r26d for libc++_shared.so.
    - name: Install NDKs
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" "ndk;30.0.16248370"
    - name: Unit tests and debug build
      env:
        NARAD_SKIP_MODEL_TESTS: '1'
      run: ./gradlew :app:testDebugUnitTest :lib:testDebugUnitTest :app:assembleDebug
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
